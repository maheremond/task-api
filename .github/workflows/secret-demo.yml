name: Secret demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      APP_ENV: ${{ vars.APP_ENV }}
    steps:
      - name: Check and demonstrate secret masking
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN is missing."
            exit 1
          fi

          echo "Secret length: ${#DEMO_TOKEN}"
          echo "Secret value (GitHub should mask it): $DEMO_TOKEN"
          echo "Application environment: ${APP_ENV}"
